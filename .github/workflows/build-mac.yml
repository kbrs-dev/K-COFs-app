name: Build Mac app

# Builds a Mac .app on every push to main (PyInstaller can't cross-compile
# from Windows/Linux -- GitHub's macos-latest runner). Publishes it to a
# single rolling release ("mac-latest-build") so computers can bookmark one
# stable download link and just re-download it after any update, instead of
# hunting for a new URL each time. Mirrors build-windows.yml -- see that
# file's comments for the parts that are identical; this one only calls out
# where Mac genuinely needs something different.

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "kbrs_markup.py"
      - "kbrs_markup.spec"
      - ".github/workflows/build-mac.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab pypdf Pillow tkinterdnd2 pypdfium2 pikepdf numpy pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller kbrs_markup.spec --noconfirm

      - name: Stamp this build's version
        # Lives inside the .app bundle itself (Contents/Resources), unlike
        # Windows where it sits next to the .exe -- see
        # engine.get_local_version()'s docstring for why. Also uploaded
        # standalone below, same as Windows, so the running app can check
        # "am I behind?" without downloading the whole zip just to find out.
        # Runs BEFORE signing below -- anything that touches the bundle's
        # contents has to happen before that, or it invalidates the
        # signature just applied.
        run: echo -n "${{ github.sha }}" > "dist/KBRS Markup.app/Contents/Resources/version.txt"

      - name: Sign the app (ad-hoc)
        # No Apple Developer account/certificate involved (that's a paid,
        # separate step -- see the README's note on the two Mac packaging
        # tiers) -- "-" means "sign with no real identity," which still
        # satisfies the one thing this actually fixes: Apple Silicon Macs
        # refuse to run ANY completely unsigned code at all, surfacing as
        # "'KBRS Markup.app' is damaged and can't be opened" (not the
        # softer "unidentified developer" prompt an ad-hoc-signed app gets
        # instead) -- a real failure hit on a real Apple Silicon Mac the
        # very first time this build ever shipped. --deep covers the
        # bundled Python/Tcl-Tk/etc. binaries inside, not just the outer
        # wrapper.
        run: codesign --force --deep --sign - "dist/KBRS Markup.app"

      - name: Zip the build
        # ditto (not plain zip/Compress-Archive) is the macOS-native way to
        # zip an .app bundle without mangling its resource forks/extended
        # attributes (including the signature just applied above).
        # --keepParent so the zip contains "KBRS Markup.app" at its root,
        # matching what stage_update() expects to find.
        run: ditto -c -k --sequesterRsrc --keepParent "dist/KBRS Markup.app" "KBRS-Markup-Mac.zip"

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-latest-build
          name: KBRS Markup (Mac) — latest
          body: |
            Automatically rebuilt from the latest push to main.

            **To install:** download `KBRS-Markup-Mac.zip`, unzip it, and drag
            `KBRS Markup.app` wherever you keep it (e.g. Applications). The
            first time you open it, macOS will say "Apple could not verify
            this app" -- right-click (or Control-click) it -> Open -> Open
            again. You only do this once; updates from inside the app don't
            need it again.

            If instead macOS says the app "is damaged and can't be opened,"
            open Terminal and run (dragging the app into Terminal after
            typing `xattr -cr ` pastes its exact path):
            `xattr -cr /path/to/KBRS Markup.app`, then try opening it again.

            **To update:** the app checks for updates on launch and can
            install them itself (Check for Updates in the File menu, or the
            banner when one's available). If you ever need to do it
            manually, re-download this same file and replace the old
            KBRS Markup.app with the new one.
          files: |
            KBRS-Markup-Mac.zip
            dist/KBRS Markup.app/Contents/Resources/version.txt
          make_latest: true
